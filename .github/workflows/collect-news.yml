name: Collect News

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx tsx scripts/collect-news.ts

      - name: Commit and push if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: collect news $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
